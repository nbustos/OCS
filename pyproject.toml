[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocs"
version = "0.1.0"
description = "OCS (marsonc) resting-state analyses on XCP-D fsLR 91k outputs"
requires-python = ">=3.10"
# Dependencies are managed by environment.yml (conda); see setup_env.sh.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
